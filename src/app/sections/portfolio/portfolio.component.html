<section id="portfolio" class="section bg-gray-50">
  <div class="container-site">
    <div class="section-header">
      <div>
        <span class="eyebrow">Portfolio</span>
        <h2 class="section-title">Our Work</h2>
      </div>
      <p class="section-intro">
        Systems we've designed and built. Some client names are withheld for confidentiality.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
      <div *ngFor="let project of portfolio"
           class="portfolio-card bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition-all duration-300 transform hover:-translate-y-2">

        <!-- Screenshot (browser frame) or icon fallback -->
        <div class="bg-gray-100 border-b border-gray-200">
          <div class="flex items-center gap-1.5 px-4 py-2 bg-gray-200">
            <span class="w-2.5 h-2.5 rounded-full bg-red-400"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-green-400"></span>
          </div>
          <img *ngIf="project.image" [src]="project.image" [alt]="project.title + ' screenshot'"
               loading="lazy" class="w-full h-56 object-cover object-top">
          <div *ngIf="!project.image"
               class="h-56 bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center">
            <svg class="w-20 h-20 text-amber-400" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" [attr.d]="project.icon"/>
            </svg>
          </div>
        </div>

        <div class="p-6">
          <h3 class="text-xl font-bold text-gray-800 mb-1 font-poppins">{{project.title}}</h3>
          <p *ngIf="project.client" class="text-sm text-blue-600 font-medium mb-2">{{project.client}}</p>
          <p class="text-gray-600 mb-4">{{project.description}}</p>

          <div *ngIf="project.challenge || project.outcome" class="text-sm space-y-2 mb-4">
            <p *ngIf="project.challenge" class="text-gray-600"><strong class="text-gray-800">Challenge:</strong> {{project.challenge}}</p>
            <p *ngIf="project.outcome" class="text-gray-600"><strong class="text-gray-800">Outcome:</strong> {{project.outcome}}</p>
          </div>

          <div class="flex flex-wrap gap-2">
            <span *ngFor="let tech of project.technologies"
                  class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">
              {{tech}}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
